name: tawrid_app
description: "توريد — منصة التوريد الدوائي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^17.5.0

  # Networking
  dio: ^5.11.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Font
  google_fonts: ^6.2.1

  # أيقونات نظام التصميم (SVG من Figma)
  flutter_svg: ^2.0.10

  # هياكل تحميل متلألئة (shimmer skeletons) — مكان مركزي في shared/ui
  shimmer: ^3.0.0

  # Logging
  logger: ^2.7.0

  # مسح الباركود بالكاميرا
  mobile_scanner: ^5.2.3

  # توليد ومشاركة PDF لتفاصيل العرض
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.3
  # Firebase منزوع من نسخة سطح المكتب. firebase_messaging بلا تنفيذ
  # لويندوز (ولذلك كان محروساً في الكود أصلاً)، لكن مجرّد وجود
  # firebase_core يُدرِجه في قائمة إضافات ويندوز فيسحب CMake حزمة
  # Firebase C++ SDK بحجم ٩١٦ ميغابايت ويترجمها — ثمنٌ كامل مقابل ميزةٍ
  # معطَّلة على هذه المنصّة. راجع lib/core/notifications/push_service.dart.
  #
  # لإعادة بناء نسخة محمولة (أندرويد/iOS) أو ويب، أعِد تفعيل السطرين
  # واسترجع push_service.dart وmain.dart وfirebase_options.dart:
  #   git checkout -- pubspec.yaml lib/main.dart \
  #     lib/core/notifications/push_service.dart lib/firebase_options.dart
  # firebase_core: ^5.1.0
  # firebase_messaging: ^17.0.1
  geolocator: ^14.0.2
  signalr_netcore: ^1.4.4
  flutter_local_notifications: 19.3.1
  image: ">=4.5.0 <4.11.0"
  file_picker: ^8.1.7
  archive: ^4.0.9
  desktop_drop: ^0.8.4
  cross_file: ^0.3.5+5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/images/logo_icon.png"
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
